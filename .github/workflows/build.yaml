name: Build, test, and release

on:
  push:
    branches: [main]
    tags: ['v2.*']
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.23.x', stable]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            example/go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/torm
      - run: go run ./cmd/torm generate --schema example/prisma/schema.prisma --out-models example/models
      - run: git diff --exit-code -- example/models
      - run: go test ./... && go vet ./...
        working-directory: example

  prisma:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npx --yes prisma@7.10.1 validate --schema example/prisma/schema.prisma
      - run: npx --yes prisma@7.10.1 validate --schema pkg/internal/schema/testdata/postgres

  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: torm_test
          POSTGRES_PASSWORD: torm_test
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U torm_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: |
            go.sum
            example/go.sum
      - run: go test -count=1 ./...
        env:
          TORM_TEST_DATABASE_URL: postgres://torm_test:torm_test@localhost:${{ job.services.postgres.ports['5432'] }}/postgres?sslmode=disable

  release:
    needs: [go, prisma, postgres]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build archives
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v2\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Expected a v2 semantic version tag."
            exit 1
          fi
          mkdir -p dist
          cp LICENSE dist/
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            binary=torm
            if [[ "$os" == windows ]]; then
              binary=torm.exe
            fi
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-X github.com/TechXTT/TORM/v2/pkg/cli.releaseVersion=$GITHUB_REF_NAME" \
              -o "dist/$binary" ./cmd/torm
            if [[ "$os" == windows ]]; then
              (cd dist && zip "torm-$os-$arch.zip" "$binary" LICENSE)
            else
              tar -czf "dist/torm-$os-$arch.tar.gz" -C dist "$binary" LICENSE
            fi
            rm "dist/$binary"
          done
          rm dist/LICENSE
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
